services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofmint
      POSTGRES_USER: proofmint
      POSTGRES_PASSWORD: proofmint_local_only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofmint"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
